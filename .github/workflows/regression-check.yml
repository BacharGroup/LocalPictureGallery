name: Regression tests

# Verifies that every behaviour built or fixed in an earlier version still works, on every change and release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Nothing that worked before is broken
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version stamps match (VERSION / header comment / meta), and the tag on a release
        run: |
          v1=$(grep -oE "const VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" LocalPictureGallery.html | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          v2=$(grep -oE '<!-- LocalPictureGallery v[0-9]+\.[0-9]+\.[0-9]+ -->' LocalPictureGallery.html | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          v3=$(grep -oE '<meta name="version" content="[0-9]+\.[0-9]+\.[0-9]+"' LocalPictureGallery.html | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "VERSION=$v1  header=$v2  meta=$v3"
          [ -n "$v1" ] && [ "$v1" = "$v2" ] && [ "$v1" = "$v3" ] || { echo "version stamps differ"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v$v1" ] || { echo "tag ${GITHUB_REF_NAME} does not match file version v$v1"; exit 1; }
          fi

      - name: Regression tests
        run: |
          npm install --silent --no-audit --no-fund jsdom
          node regression-check.js LocalPictureGallery.html
