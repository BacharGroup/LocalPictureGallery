name: Security check

# Verifies that LocalPictureGallery.html cannot talk to a network or persist data, on every change and release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: No network, no storage, single file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static checks (allow-listed addresses, no scripts/fetch/storage, single file)
        run: bash security-check.sh LocalPictureGallery.html

      - name: Runtime check – page loads and makes zero network requests
        run: |
          npm install --silent --no-audit --no-fund jsdom
          node runtime-check.js LocalPictureGallery.html

      - name: Repository contains the tool only (no images committed, app icons excepted)
        run: |
          imgs=$(git ls-files | grep -v '^icons/icon-[0-9]*\.png$' | grep -iE '\.(jpe?g|png|gif|webp|bmp|avif|heic|heif|tiff?)$' || true)
          if [ -n "$imgs" ]; then echo "image files are committed:"; echo "$imgs"; exit 1; fi
          echo "no image files in repository"
