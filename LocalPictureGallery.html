<style>
  :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1c1c1c; --accent:#4c8bf5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--fg); }

  /* ---------- header: brand row + toolbar row ---------- */
  header { position:sticky; top:0; z-index:5; background:rgba(17,17,17,.95); backdrop-filter:blur(6px); border-bottom:1px solid #222; }
  .brand { position:relative; display:flex; align-items:center; justify-content:center; padding:18px 16px 12px; }
  .brand .title { display:flex; align-items:center; gap:12px; }
  .brand .logo { width:36px; height:36px; border-radius:8px; display:block; }
  .brand h1 { margin:0; font-size:28px; letter-spacing:.5px; }
  #ver { position:absolute; bottom:6px; right:16px; color:var(--muted); font-size:11px; direction:ltr; text-decoration:none; }
  #ver:hover { color:var(--fg); text-decoration:underline; }
  /* language picker always top-left, version always bottom-right – in both text directions */
  .brand .langwrap { position:absolute; top:50%; transform:translateY(-50%); left:16px; direction:ltr; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:0 16px 12px; }
  @media (max-width:600px) {
    .brand { padding:14px 16px 22px; }
    .brand .title { margin-inline-start:110px; gap:8px; }
    html[dir=rtl] .brand .title { margin-inline-start:0; margin-inline-end:110px; }
    .brand .logo { width:28px; height:28px; border-radius:6px; }
    .brand h1 { font-size:20px; }
    .brand .langwrap { top:14px; transform:none; }
    #langBtn { padding:5px 8px; font-size:12px; }
  }

  .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .btn.secondary { background:#333; }
  .btn:disabled { opacity:.5; cursor:default; }
  input[type=file] { display:none; }

  /* ---------- language picker with flags ---------- */
  .langwrap { position:relative; }
  #langBtn { display:flex; align-items:center; gap:8px; background:#1a1a1a; color:var(--fg); border:1px solid #333; border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; }
  #langBtn .flag, #langMenu .flag { width:22px; height:15px; border-radius:2px; display:block; flex:none; }
  #langMenu { position:absolute; top:calc(100% + 6px); left:0; min-width:170px; background:#1c1c1c; border:1px solid #333; border-radius:10px; padding:6px; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  html[dir=rtl] #langMenu { left:auto; right:0; }
  #langMenu button { display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; color:var(--fg); padding:8px 10px; border-radius:6px; font-size:14px; cursor:pointer; text-align:start; }
  #langMenu button:hover, #langMenu button:focus { background:#2a2a2a; outline:0; }
  #langMenu button[aria-checked=true] { background:#243b66; }
  #langMenu button .native { flex:1; }
  #langMenu button .code { color:var(--muted); font-size:11px; direction:ltr; }

  /* ---------- search with mic ---------- */
  .searchwrap { flex:1; min-width:200px; position:relative; display:flex; align-items:center; }
  #search { width:100%; padding:8px 40px 8px 12px; border-radius:8px; border:1px solid #333; background:#1a1a1a; color:var(--fg); font-size:14px; }
  html[dir=rtl] #search { padding:8px 12px 8px 40px; }
  #mic { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:32px; height:32px; border:0; border-radius:6px; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; line-height:1; }
  html[dir=rtl] #mic { right:auto; left:4px; }
  #mic:hover { background:#2a2a2a; color:var(--fg); }
  #mic.listening { color:#fff; background:#c0392b; animation:pulse 1s infinite; }
  #mic.hidden { display:none; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(192,57,43,.6); } 50% { box-shadow:0 0 0 6px rgba(192,57,43,0); } }
  #micMsg { color:var(--muted); font-size:12px; min-height:1em; }
  #count { color:var(--muted); font-size:13px; }

  main { padding:16px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--card); border-radius:10px; overflow:hidden; cursor:pointer; }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#000; }
  .card .name { padding:6px 8px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:ltr; text-align:left; }
  html[dir=rtl] .card .name { text-align:right; }
  #empty { color:var(--muted); text-align:center; padding:60px 20px; line-height:1.6; }
  #more { color:var(--muted); text-align:center; padding:20px; font-size:13px; min-height:1px; }

  #lb { position:fixed; inset:0; background:rgba(0,0,0,.95); display:none; flex-direction:column; z-index:10; }
  #lb.open { display:flex; }
  #lb .bar { display:flex; align-items:center; gap:10px; padding:10px 16px; color:var(--muted); font-size:13px; flex-wrap:wrap; }
  #lb .bar .name { flex:1; direction:ltr; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
  html[dir=rtl] #lb .bar .name { text-align:right; }
  /* rename row: always English, LTR, left-aligned */
  #renameBar { border-top:1px solid #222; direction:ltr; justify-content:flex-start; text-align:left; }
  #renameWrap { display:flex; align-items:center; gap:6px; flex-wrap:wrap; direction:ltr; }
  #newName { padding:6px 10px; border-radius:8px; border:1px solid #444; background:#1a1a1a; color:var(--fg); font-size:14px; min-width:240px; direction:ltr; text-align:left; }
  #ext { color:var(--muted); direction:ltr; }
  #msg { font-size:13px; color:#f66; }
  #msg.ok { color:#6c6; }
  .hidden { display:none !important; }
  #lb .stage { flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0; }
  #lb img { max-width:100%; max-height:100%; object-fit:contain; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); color:#fff; border:0;
         font-size:26px; width:48px; height:64px; border-radius:8px; cursor:pointer; }
  #prev { left:8px; } #next { right:8px; }
</style>
</head>

  let rendered = 0;   // how many of `shown` are in the grid
  let cur = -1;

  // ---------- language menu (flag + native name) ----------
  Object.keys(T).forEach(code => {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'option'; b.dataset.code = code;
    b.innerHTML = `<span class="flag">${FLAGS[T[code].flag] || ''}</span><span class="native">${T[code].name}</span><span class="code">${code}</span>`;
    b.onclick = () => { applyLang(code); closeLangMenu(); };   // for this tab only – nothing is written to the address or the device
    langMenu.appendChild(b);
  });
  function openLangMenu() { langMenu.classList.remove('hidden'); langBtn.setAttribute('aria-expanded', 'true'); langMenu.querySelector('[aria-checked=true]')?.focus(); }
  function closeLangMenu() { langMenu.classList.add('hidden'); langBtn.setAttribute('aria-expanded', 'false'); }
  langBtn.onclick = () => langMenu.classList.contains('hidden') ? openLangMenu() : closeLangMenu();
  document.addEventListener('click', e => { if (!e.target.closest('.langwrap')) closeLangMenu(); });
  langMenu.addEventListener('keydown', e => {
    const bs = [...langMenu.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
    else if (e.key === 'Escape') { closeLangMenu(); langBtn.focus(); }
  });

  // ===================== Cross-script matching (Hebrew ⇄ Latin) =====================
  // A filter typed or spoken in one script also matches file names written in the other.
  // Names are reduced to rough consonant keys: Hebrew letters → Latin sounds, vowels dropped,
  // so "Yossi" ≈ "yosi" ≈ "יוסי" and "Rivka" ≈ "רבקה". Hebrew vav/yod can be vowels or consonants,
  // so Hebrew text yields both readings. Approximate on purpose – it finds names, it does not translate.
  // Hebrew letter → Latin sound. sh/s and ch/kh/h/k are merged on purpose: transliteration is inconsistent
  // about them, and a filter is better off matching a few extra names than missing one.
  const HE2LAT = { 'א':'', 'ב':'v', 'ג':'g', 'ד':'d', 'ה':'h', 'ו':'v', 'ז':'z', 'ח':'k',
                   'ט':'t', 'י':'y', 'כ':'k', 'ך':'k', 'ל':'l', 'מ':'m', 'ם':'m', 'נ':'n',
                   'ן':'n', 'ס':'s', 'ע':'', 'פ':'f', 'ף':'f', 'צ':'ts', 'ץ':'ts', 'ק':'k',
                   'ר':'r', 'ש':'s', 'ת':'t' };
  const HEB = /[א-ת]/;
  const LAT_FOLD = [[/sch|sh/g,'s'],[/ph/g,'f'],[/ck|kh|ch|q/g,'k'],[/c(?=[eiy])/g,'s'],[/c/g,'k'],[/[wb]/g,'v'],[/p/g,'f'],[/x/g,'ks'],[/tz|tc|z/g,'ts'],[/j/g,'y']];
  function latinKey(s) {
    for (const [re, to] of LAT_FOLD) s = s.replace(re, to);
    s = s.replace(/[aeiou]/g, '');                 // drop vowels
    s = s.replace(/(?<=[a-z])y(?=[a-z])|y$|^y(?=[aeiou])/g, ''); // y as a vowel (Yossi, Avi, Chaim)
    s = s.replace(/h$/g, '').replace(/h/g, 'k');   // final h silent (Sarah); elsewhere ≈ guttural (Shahar / שחר)
    s = s.replace(/([a-z])\1+/g, '$1');            // collapse doubled letters only – digits are kept exactly (117 ≠ 17)
    return s.replace(/[^a-z0-9؀-ۿЀ-ӿ]+/g, ' ').trim();   // Arabic/Cyrillic letters kept as they are
  }
  function hebToLatin(w, vowelVav) {             // one reading of a Hebrew word
    w = w.replace(/וו/g, 'v').replace(/יי/g, 'y');   // doubled vav / yod are consonants
    if (vowelVav) w = w.replace(/(?<=[א-ת])ו(?=[א-ת])/g, 'o');   // vav between letters = o/u
    w = w.replace(/(?<=[א-ת])י(?=[א-ת]|$)/g, 'i');              // yod after a letter = i
    return w.replace(/[א-ת]/g, ch => HE2LAT[ch] ?? ch);
  }
  function phonKeys(s) {                          // → array of keys (1 for Latin text, 2 for Hebrew)
    s = s.toLowerCase().normalize('NFKD').replace(/[֑-ׇ̀-ͯ׳״"']/g, '');   // niqqud, accents, geresh
    if (!HEB.test(s)) return [latinKey(s)];
    return [true, false].map(vv => latinKey(s.replace(/[א-ת]+/g, w => hebToLatin(w, vv))));
  }
  const stem = name => name.replace(/\.[^.\/]+$/, '');   // extension never takes part in matching
  const keysOf = name => ({ raw: name.toLowerCase(), ph: phonKeys(stem(name)) });
  function matches(it, qraw, qkeys) {
    if (!qraw) return true;
    if (it.keys.raw.includes(qraw)) return true;                // ordinary substring match
    if (/^[\d\s._-]+$/.test(qraw)) return false;              // a numeric query is exact – no phonetic matching
    return qkeys.some(q => q && it.keys.ph.some(k =>
      q.length >= 2 ? k.includes(q) : k.split(' ').includes(q)   // one-consonant names (Noa) must match a whole word
    ));
  }

  // ===================== Spoken numbers → digits =====================
  // The recognizer returns digits for English ("forty-two" → 42) but words for Hebrew and Arabic.
  // This converts number words in a transcript to digits, 0–999,999, so "תמונה ארבעים ושתיים" → "תמונה 42"
  // and "صورة خمسة وعشرين" → "صورة 25". Eastern Arabic digits (٤٢) are folded to 42 as well.
  // Non-number words pass through untouched. Compounds use the natural order of each language.
  const NUM = {
    he: { units: { 'אפס':0,'אחד':1,'אחת':1,'שניים':2,'שתיים':2,'שני':2,'שתי':2,'שלוש':3,'שלושה':3,'ארבע':4,'ארבעה':4,'חמש':5,'חמישה':5,
                   'שש':6,'שישה':6,'שבע':7,'שבעה':7,'שמונה':8,'תשע':9,'תשעה':9,'עשר':10,'עשרה':10,
                   'שלושת':3,'ארבעת':4,'חמשת':5,'ששת':6,'שבעת':7,'שמונת':8,'תשעת':9,'עשרת':10,
                   'אחד עשר':11,'אחת עשרה':11,'שנים עשר':12,'שתים עשרה':12,'שלושה עשר':13,'שלוש עשרה':13,'ארבעה עשר':14,'ארבע עשרה':14,
                   'חמישה עשר':15,'חמש עשרה':15,'שישה עשר':16,'שש עשרה':16,'שבעה עשר':17,'שבע עשרה':17,'שמונה עשר':18,'שמונה עשרה':18,'תשעה עשר':19,'תשע עשרה':19 },
          tens:  { 'עשרים':20,'שלושים':30,'ארבעים':40,'חמישים':50,'שישים':60,'שבעים':70,'שמונים':80,'תשעים':90 },
          hundreds: { 'מאה':100,'מאתיים':200,'שלוש מאות':300,'ארבע מאות':400,'חמש מאות':500,'שש מאות':600,'שבע מאות':700,'שמונה מאות':800,'תשע מאות':900 },
          thousand: { 'אלף':1000,'אלפיים':2000 }, thousands: 'אלפים', and: 'ו' },
    ar: { units: { 'صفر':0,'واحد':1,'واحدة':1,'اثنان':2,'اثنين':2,'اثنتان':2,'اثنتين':2,'ثلاثة':3,'ثلاث':3,'أربعة':4,'اربعة':4,'أربع':4,'اربع':4,
                   'خمسة':5,'خمس':5,'ستة':6,'ست':6,'سبعة':7,'سبع':7,'ثمانية':8,'ثماني':8,'تسعة':9,'تسع':9,'عشرة':10,'عشر':10,
                   'أحد عشر':11,'احد عشر':11,'إحدى عشرة':11,'احدى عشرة':11,'اثنا عشر':12,'اثني عشر':12,'اثنتا عشرة':12,'اثنتي عشرة':12,
                   'ثلاثة عشر':13,'ثلاث عشرة':13,'أربعة عشر':14,'اربعة عشر':14,'أربع عشرة':14,'خمسة عشر':15,'خمس عشرة':15,'ستة عشر':16,'ست عشرة':16,
                   'سبعة عشر':17,'سبع عشرة':17,'ثمانية عشر':18,'ثماني عشرة':18,'تسعة عشر':19,'تسع عشرة':19 },
          tens:  { 'عشرون':20,'عشرين':20,'ثلاثون':30,'ثلاثين':30,'أربعون':40,'اربعون':40,'أربعين':40,'اربعين':40,'خمسون':50,'خمسين':50,
                   'ستون':60,'ستين':60,'سبعون':70,'سبعين':70,'ثمانون':80,'ثمانين':80,'تسعون':90,'تسعين':90 },
          hundreds: { 'مائة':100,'مئة':100,'مائتان':200,'مائتين':200,'مئتان':200,'مئتين':200,'ثلاثمائة':300,'ثلاثمئة':300,'أربعمائة':400,'اربعمائة':400,'أربعمئة':400,'اربعمئة':400,
                      'خمسمائة':500,'خمسمئة':500,'ستمائة':600,'ستمئة':600,'سبعمائة':700,'سبعمئة':700,'ثمانمائة':800,'ثمانمئة':800,'تسعمائة':900,'تسعمئة':900 },
          thousand: { 'ألف':1000,'الف':1000,'ألفان':2000,'الفان':2000,'ألفين':2000,'الفين':2000 }, thousands: 'آلاف', and: 'و' }
  };
  function wordsToDigits(text) {
    text = text.replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660));   // Eastern Arabic digits → 0-9
    for (const L of Object.values(NUM)) {
      const all = { ...L.units, ...L.tens, ...L.hundreds, ...L.thousand };
      const strip = w => w.replace(new RegExp('^' + L.and + '(?=.)'), '');                 // leading "and" (ו / و) glued to the word
      const isNum = w => all[strip(w)] !== undefined || strip(w) === L.thousands;
      const words = text.split(/\s+/), out = [];
      const startsNum = i => isNum(words[i]) || (i + 1 < words.length && all[strip(words[i]) + ' ' + strip(words[i + 1])] !== undefined);
      for (let i = 0; i < words.length; ) {
        if (!startsNum(i)) { out.push(words[i]); i++; continue; }
        // collect a run of number words (two-word units like "ארבע עשרה" are joined first)
        let total = 0, cur = 0, j = i, any = false;
        while (j < words.length) {
          let w = strip(words[j]), pair = j + 1 < words.length ? w + ' ' + strip(words[j + 1]) : null;
          if (pair && all[pair] !== undefined) { w = pair; j += 2; } else if (isNum(words[j])) j++; else break;
          if (all[w] === undefined && w !== L.thousands) break;
          const v = all[w];
          if (w === L.thousands) { total += (cur || 1) * 1000; cur = 0; }
          else if (v >= 1000)    { total += (cur || 1) * (v === 1000 ? 1000 : v); cur = 0; }
          else if (v >= 100)     { cur += v; }
          else                   { cur += v; }
          any = true;
        }
        out.push(String(total + cur)); i = any ? j : i + 1;
      }
      text = out.join(' ');
    }
    return text;
  }

  // ===================== Voice search (on-device only) =====================
  // Uses the browser's Web Speech API *only* in on-device mode (processLocally = true).
  // The button is shown only when the browser can recognise speech locally for the current language;
  // otherwise it is hidden. The code never falls back to cloud recognition, so audio never leaves the device.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  function setMicMsg(s) { micMsg.textContent = s || ''; }
  async function setupMic() {
    stopMic();
    mic.classList.add('hidden'); setMicMsg('');
    if (!SR || typeof SR.available !== 'function') return;       // no on-device capability in this browser
    const opts = { langs: [T[lang].speech], processLocally: true };
    let status;
    try { status = await SR.available(opts); } catch { return; }
    if (status === 'available' || status === 'downloadable' || status === 'downloading') mic.classList.remove('hidden');
  }
  async function startMic() {
    if (!SR) return;
    const opts = { langs: [T[lang].speech], processLocally: true };
    let status = await SR.available(opts).catch(() => 'unavailable');
    if (status === 'downloadable') {
      setMicMsg(t('micDownload'));
      const ok = await SR.install(opts).catch(() => false);
      status = ok ? 'available' : 'unavailable';
    }
    if (status !== 'available') { setMicMsg(t('micUnavailable')); mic.classList.add('hidden'); return; }
    rec = new SR();
    rec.lang = T[lang].speech;
    rec.processLocally = true;      // on-device only – never cloud
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.onstart = () => { listening = true; mic.classList.add('listening'); setMicMsg(t('micListening')); };
    rec.onresult = e => {
      let text = '';
      for (const r of e.results) text += r[0].transcript;
      search.value = wordsToDigits(text.trim()); render();
    };
    rec.onerror = e => { setMicMsg(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? t('micDenied') : e.error === 'no-speech' ? t('micNone') : t('micUnavailable')); };
    rec.onend = () => { listening = false; mic.classList.remove('listening'); if (micMsg.textContent === t('micListening')) setMicMsg(''); rec = null; };
    try { rec.start(); } catch { setMicMsg(t('micUnavailable')); }
  }
  function stopMic() { if (rec) { try { rec.stop(); } catch {} } }
  mic.onclick = () => listening ? stopMic() : startMic();

  const splitExt = n => { const m = n.match(/^(.*?)(\.[^.]*)?$/); return [m[1], m[2] || '']; };
  const sortItems = () => items.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  function clear() { items.forEach(i => URL.revokeObjectURL(i.url)); items = []; }

  // ===================== Loading =====================
  function loadFiles(fileList) {           // via <input> (view only)
    clear();
    items = [...fileList]
      .filter(f => f.type.startsWith('image/') || IMG.test(f.name))
      .map(f => { const name = f.webkitRelativePath || f.name; return { name, url: URL.createObjectURL(f), handle: null, parent: null, keys: keysOf(name) }; });
    finish();
  }
  async function pickDir() {               // File System Access API (with rename)
    if (!canFS) { $('dirInput').click(); return; }
    let dir;
    try { dir = await window.showDirectoryPicker({ mode: 'readwrite' }); }
    catch { return; }                      // cancelled or denied
    clear();
    await walk(dir, '');
    finish();
  }
  async function walk(dir, prefix) {
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind === 'directory') await walk(handle, prefix + name + '/');
      else if (IMG.test(name)) {
        const f = await handle.getFile();
        const full = prefix + name;
        items.push({ name: full, url: URL.createObjectURL(f), handle, parent: dir, keys: keysOf(full) });
      }
    }
  }
  function finish() { sortItems(); search.value = ''; render(); }

  // ===================== Grid =====================
  function makeCard(it, idx) {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.loading = 'lazy'; img.src = it.url; img.alt = '';
    const name = document.createElement('div');
    name.className = 'name'; name.textContent = it.name; name.title = it.name;
    card.append(img, name);
    card.onclick = () => open(idx);
    return card;
  }
  function render() {
    const qraw = search.value.trim().toLowerCase(), qkeys = qraw ? phonKeys(qraw) : [];
    shown = qraw ? items.filter(i => matches(i, qraw, qkeys)) : items;
    grid.innerHTML = '';
    rendered = 0;
    empty.style.display = items.length ? 'none' : '';
    renderMore();
  }
  function renderMore() {                  // next 100; called again when the sentinel at the bottom comes into view
    const end = Math.min(rendered + PAGE, shown.length);
    const frag = document.createDocumentFragment();
    for (let i = rendered; i < end; i++) frag.appendChild(makeCard(shown[i], i));
    grid.appendChild(frag);
    rendered = end;
    updateStatus();
    if (rendered < shown.length) requestAnimationFrame(() => {   // tall screens: keep going until there is something to scroll
      if (more.getBoundingClientRect().top < innerHeight + 600) renderMore();
    });
  }
  function updateStatus() {
    more.textContent = rendered < shown.length ? t('more', { n: rendered, m: shown.length }) : '';
    count.textContent = items.length ? (shown.length === items.length ? `${items.length}` : `${shown.length} / ${items.length}`) : '';
  }
  new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting) && rendered < shown.length) renderMore();
  }, { rootMargin: '600px' }).observe(more);

  // ===================== Lightbox =====================
  function open(i) { cur = i; show(); lb.classList.add('open'); }
  function show() {
    const it = shown[cur];
    while (rendered <= cur && rendered < shown.length) renderMore();   // make sure the card exists when closing
    lbImg.src = it.url;
    lbName.textContent = it.name;
    lbIdx.textContent = `${cur + 1} / ${shown.length}`;
    setMsg('');
    if (it.handle) {
      renameBar.classList.remove('hidden');
      const [base, e] = splitExt(it.name.split('/').pop());
      newName.value = base; ext.textContent = e;
    } else renameBar.classList.add('hidden');
  }
  function close() { lb.classList.remove('open'); lbImg.removeAttribute('src'); }
  function step(d) { if (!shown.length) return; cur = (cur + d + shown.length) % shown.length; show(); }
  function setMsg(text, ok) { msg.textContent = text; msg.className = ok ? 'ok' : ''; }

  // ===================== Rename on disk (extension kept) =====================
  async function doRename() {
    const it = shown[cur]; if (!it || !it.handle) return;
    const oldFull = it.name.split('/').pop();
    const [, e] = splitExt(oldFull);
    const base = newName.value.trim();
    if (!base) { setMsg(t('msgEmpty')); return; }
    if (/[\\/:*?"<>|]/.test(base)) { setMsg(t('msgInvalid')); return; }
    const target = base + e;
    if (target === oldFull) { setMsg(t('msgSame')); return; }

    saveName.disabled = true;
    try {
      let exists = true;
      try { await it.parent.getFileHandle(target); } catch { exists = false; }
      if (exists) throw new Error(t('msgExists'));

      let newHandle = null;
      if (typeof it.handle.move === 'function') {
        try { await it.handle.move(target); newHandle = it.handle; } catch { newHandle = null; }
      }
      if (!newHandle) {                    // fallback: copy to the new name, verify size, then delete the original
        const file = await it.handle.getFile();
        newHandle = await it.parent.getFileHandle(target, { create: true });
        const w = await newHandle.createWritable();
        await w.write(file); await w.close();
        const check = await newHandle.getFile();
        if (check.size !== file.size) throw new Error(t('msgCopyFail'));
        await it.parent.removeEntry(oldFull);
      }

      const nf = await newHandle.getFile();
      URL.revokeObjectURL(it.url);
      it.url = URL.createObjectURL(nf);
      it.handle = newHandle;
      it.name = it.name.slice(0, it.name.length - oldFull.length) + target;
      it.keys = keysOf(it.name);
      sortItems(); render();
      cur = shown.indexOf(it);
      if (cur < 0) close(); else { show(); setMsg(t('msgDone'), true); }
    } catch (err) {
      setMsg(err && err.message ? err.message : t('msgFail'));
    } finally {
      saveName.disabled = false;
    }
  }

  // ===================== Events =====================
  $('pickDir').onclick = pickDir;
  $('dirInput').onchange = e => loadFiles(e.target.files);
  $('files').onchange = e => loadFiles(e.target.files);
  search.oninput = render;
  $('close').onclick = close;
  $('prev').onclick = e => { e.stopPropagation(); step(-1); };
  $('next').onclick = e => { e.stopPropagation(); step(1); };
  stage.onclick = e => { if (e.target === stage) close(); };
  saveName.onclick = doRename;
  newName.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); doRename(); } };

  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') { close(); return; }
    if (document.activeElement === newName) return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  let x0 = null;
  stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  });

  $('ver').textContent = 'v' + VERSION;
  applyLang(detectLang());
})();
</script>
</body>
</html>
